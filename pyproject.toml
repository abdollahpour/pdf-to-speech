[project]
name = "pdf-to-speech"
version = "0.2.0"
description = "Read a PDF and write it out as spoken audio."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hamed Abdollahpour", email = "hamed@abdollahpour.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.139.0",
    "lameenc>=1.8.4",
    "piper-tts>=1.8.0",
]

[project.scripts]
pdf-to-speech = "pdf_to_speech.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
